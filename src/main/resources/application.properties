spring.application.name=schemusic-api

# Datasource MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/schemusic?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# SQL initialization
spring.sql.init.mode=never

# JWT
app.jwt.secret=troque_por_uma_chave_muito_secreta_e_longa_com_32_ou_mais_chars
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:360000}
app.jwt.refresh-expiration-ms=604800000

# Seed admin padrao
app.admin.seed-enabled=true
app.admin.nome=Administrador
app.admin.email=admin@schemusic.com
app.admin.senha=admin123
app.admin.dev.nome=dev_schemusic
app.admin.dev.email=dev_schemusic@schemusic.com
app.admin.dev.senha=dev123

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174
